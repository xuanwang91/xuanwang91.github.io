---
layout: default
---

<article class="standard-page post-page">
  {% if page.title %}
    <h1>{{ page.title }}</h1>
  {% endif %}

  {% if page.collection == 'teaching' %}
    <p class="page-meta">
      {{ page.type }}{% if page.venue %}, <i>{{ page.venue }}</i>{% endif %}{% if page.date %}, {{ page.date | date: "%Y" }}{% endif %}
    </p>
  {% endif %}

  {{ content }}
</article>
